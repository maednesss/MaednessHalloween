  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050505;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .poster {
      display: block;
      width: 100%;
      height: 100svh;
      object-fit: contain;
      object-position: center;
    }

    .bat-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

    .bat {
      position: absolute;
      left: -100px;
      top: var(--top);
      width: var(--size);
      color: #050505;
      opacity: var(--opacity, .9);
      filter: drop-shadow(0 0 2px rgba(255, 0, 0, .35));
      animation: fly var(--duration) linear var(--delay) infinite;
      will-change: transform;
    }

    .bat svg { display: block; width: 100%; }

    .wing-left, .wing-right {
      transform-box: fill-box;
      animation-duration: .32s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }

    .wing-left {
      transform-origin: 100% 50%;
      animation-name: flap-left;
    }

    .wing-right {
      transform-origin: 0% 50%;
      animation-name: flap-right;
    }

    @keyframes fly {
      0%   { transform: translate(-12vw, 0) rotate(-7deg); }
      20%  { transform: translate(25vw, -18px) rotate(3deg); }
      45%  { transform: translate(55vw, 22px) rotate(-3deg); }
      70%  { transform: translate(85vw, -15px) rotate(5deg); }
      100% { transform: translate(115vw, 8px) rotate(-4deg); }
    }

    @keyframes flap-left {
      from { transform: rotate(-8deg) scaleY(1); }
      to   { transform: rotate(38deg) scaleY(.72); }
    }

    @keyframes flap-right {
      from { transform: rotate(8deg) scaleY(1); }
      to   { transform: rotate(-38deg) scaleY(.72); }
    }

    /* Numero discreto nell'angolo */
    #visitor-count {
      position: fixed;
      right: 7px;
      bottom: 5px;
      z-index: 20;
      color: rgba(255, 255, 255, .23);
      font: 10px/1 monospace;
      letter-spacing: 1px;
      pointer-events: none;
      user-select: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .bat { display: none; animation: none; }
    }
  </style>
</head>
