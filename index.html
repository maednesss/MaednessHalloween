
<!DOCTYPE html>

  <meta charset="UTF-8">

  <meta name="theme-color" content="#050505">

  <title>MÆDNESS® — 31/10</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050505;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .poster {
      display: block;
      width: 100%;
      height: 100svh;
      object-fit: contain;
      object-position: center;
    }

    /* Livello animazioni */
    .bat-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

    .bat {
      position: absolute;
      left: -100px;
      top: var(--top);
      width: var(--size);
      height: auto;
      color: #050505;
      opacity: var(--opacity, 0.95);
      filter: drop-shadow(0 0 2px rgba(255, 0, 0, 0.35));
      animation: fly var(--duration) linear var(--delay) infinite;
      will-change: transform;
    }

    .bat svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .wing-left {
      transform-box: fill-box;
      transform-origin: 100% 50%;
      animation: flap-left 0.32s ease-in-out infinite alternate;
    }

    .wing-right {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: flap-right 0.32s ease-in-out infinite alternate;
    }

    @keyframes fly {
      0% {
        transform: translate3d(-12vw, 0, 0) rotate(-7deg);
      }
      20% {
        transform: translate3d(25vw, -18px, 0) rotate(3deg);
      }
      45% {
        transform: translate3d(55vw, 22px, 0) rotate(-3deg);
      }
      70% {
        transform: translate3d(85vw, -15px, 0) rotate(5deg);
      }
      100% {
        transform: translate3d(115vw, 8px, 0) rotate(-4deg);
      }
    }

    @keyframes flap-left {
      from { transform: rotate(-8deg) scaleY(1); }
      to   { transform: rotate(38deg) scaleY(0.72); }
    }

    @keyframes flap-right {
      from { transform: rotate(8deg) scaleY(1); }
      to   { transform: rotate(-38deg) scaleY(0.72); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bat {
        animation: none;
        display: none;
      }
    }
  </style>
</head>
