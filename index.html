
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="noindex, nofollow">
  <title>MÆDNESS® — 31/10</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050505;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .poster {
      display: block;
      width: 100%;
      height: 100svh;
      object-fit: contain;
      object-position: center;
    }

    .bats {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }

    .bat {
      position: absolute;
      width: 30px;
      height: 22px;
      fill: #d71920;
      opacity: 0;
      filter: drop-shadow(0 0 5px #d71920);
      animation: fly linear infinite;
    }

    .bat:nth-child(1) {
      top: 15%;
      animation-duration: 13s;
    }

    .bat:nth-child(2) {
      top: 32%;
      animation-duration: 17s;
      animation-delay: 3s;
      width: 22px;
    }

    .bat:nth-child(3) {
      top: 55%;
      animation-duration: 15s;
      animation-delay: 6s;
      width: 26px;
    }

    .bat:nth-child(4) {
      top: 72%;
      animation-duration: 19s;
      animation-delay: 2s;
      width: 20px;
    }

    .bat:nth-child(5) {
      top: 85%;
      animation-duration: 14s;
      animation-delay: 8s;
      width: 24px;
    }

    @keyframes fly {
      0% {
        left: -10%;
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.85;
      }

      50% {
        transform: translateY(-35px) rotate(8deg);
      }

      90% {
        opacity: 0.85;
      }

      100% {
        left: 110%;
        transform: translateY(20px) rotate(-8deg);
        opacity: 0;
      }
    }

    .visitor-count {
      position: fixed;
      right: 8px;
      bottom: 6px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.45);
      font: 9px/1 monospace;
      letter-spacing: 1px;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .bat {
        animation: none;
        display: none;
      }
    }
  </style>
</head>

<body>
  <img
    class="poster"
    src="./halloween.png"
    alt="MÆDNESS — 31/10"
  >

  <div class="bats" aria-hidden="true">
    <svg class="bat" viewBox="0 0 64 40">
      <path d="M32 15 C25 4 17 5 8 1 L12 13 1 9 5 25 17 20 23 30 29 24 32 32 35 24 41 30 47 20 59 25 63 9 52 13 56 1 C47 5 39 4 32 15Z"/>
    </svg>

    <svg class="bat" viewBox="0 0 64 40">
      <path d="M32 15 C25 4 17 5 8 1 L12 13 1 9 5 25 17 20 23 30 29 24 32 32 35 24 41 30 47 20 59 25 63 9 52 13 56 1 C47 5 39 4 32 15Z"/>
    </svg>

    <svg class="bat" viewBox="0 0 64 40">
      <path d="M32 15 C25 4 17 5 8 1 L12 13 1 9 5 25 17 20 23 30 29 24 32 32 35 24 41 30 47 20 59 25 63 9 52 13 56 1 C47 5 39 4 32 15Z"/>
    </svg>

    <svg class="bat" viewBox="0 0 64 40">
      <path d="M32 15 C25 4 17 5 8 1 L12 13 1 9 5 25 17 20 23 30 29 24 32 32 35 24 41 30 47 20 59 25 63 9 52 13 56 1 C47 5 39 4 32 15Z"/>
    </svg>

    <svg class="bat" viewBox="0 0 64 40">
      <path d="M32 15 C25 4 17 5 8 1 L12 13 1 9 5 25 17 20 23 30 29 24 32 32 35 24 41 30 47 20 59 25 63 9 52 13 56 1 C47 5 39 4 32 15Z"/>
    </svg>
  </div>

  <div class="visitor-count" id="visitorCount"></div>

  <script>
    const counter = document.getElementById("visitorCount");

    // Chiave dedicata al sito Halloween MÆDNESS.
    // Non riutilizzare questa chiave in altri progetti.
    const counterUrl =
      "https://countapi.mileshilliard.com/api/v1/hit/maedness_halloween_31_10_2026_a83f";

    // Evita di contare più volte lo stesso caricamento
    // se lo script viene eseguito più volte nella pagina.
    let counterStarted = false;

    async function updateVisitorCount() {
      if (counterStarted) return;
      counterStarted = true;

      try {
        const response = await fetch(counterUrl);
        if (!response.ok) throw new Error("Counter unavailable");

        const data = await response.json();
        if (data.value !== undefined) {
          counter.textContent = data.value;
        }
      } catch (error) {
        // Se il servizio non risponde, il sito resta visibile.
        counter.textContent = "";
      }
    }

    updateVisitorCount();
  </script>
</body>
</html>
